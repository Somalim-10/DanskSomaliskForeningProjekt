<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rediger event – Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-form.css" />
</head>
<body>

<div id="app">
    <div class="admin-card">

        <div class="card-header">
            <div class="card-header-icon">
                <i class="fas fa-calendar-pen"></i>
            </div>
            <div>
                <h1>Rediger event</h1>
                <p>Opdater oplysningerne for dette arrangement</p>
            </div>
        </div>

        <!-- Loading -->
        <div class="card-body" v-if="isLoading">
            <div class="loading-overlay">
                <i class="fas fa-spinner fa-spin"></i>
                Henter event...
            </div>
        </div>

        <!-- Form -->
        <div class="card-body" v-else>

            <div v-if="message" class="message-box" :class="isSuccess ? 'success' : 'error'">
                <i :class="isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
                {{ message }}
            </div>

            <div class="form-group">
                <label for="title">Titel</label>
                <input id="title" v-model="formData.title" type="text" placeholder="F.eks. Eid-fejring 2026" />
            </div>

            <div class="form-group">
                <label for="date">Dato</label>
                <input id="date" v-model="formData.date" type="date" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startTime">Starttidspunkt (time)</label>
                    <input id="startTime" v-model.number="formData.startTime" type="number" min="0" max="23" />
                </div>
                <div class="form-group">
                    <label for="duration">Varighed (timer)</label>
                    <input id="duration" v-model.number="formData.duration" type="number" min="1" max="12" />
                </div>
            </div>

            <div class="form-group">
                <label for="description">Beskrivelse</label>
                <textarea id="description" v-model="formData.description" placeholder="Kort beskrivelse af arrangementet..."></textarea>
            </div>

        </div>

        <div class="card-footer">
            <button class="btn btn-secondary" @click="goBack">
                <i class="fas fa-arrow-left"></i> Tilbage
            </button>
            <button class="btn btn-primary" @click="updateItem" :disabled="isLoading || isSuccess">
                <i class="fas fa-save"></i> Gem ændringer
            </button>
        </div>

    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="edit.js"></script>
</body>
</html>
