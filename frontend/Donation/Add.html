<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilføj MobilePay – Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-form.css" />
</head>
<body>

<div id="app">
    <div class="admin-card">

        <div class="card-header">
            <div class="card-header-icon">
                <i class="fas fa-mobile-screen-button"></i>
            </div>
            <div>
                <h1>Tilføj MobilePay</h1>
                <p>Udfyld felterne og gem det nye MobilePay-nummer</p>
            </div>
        </div>

        <div class="card-body">

            <div v-if="message" class="message-box" :class="isSuccess ? 'success' : 'error'">
                <i :class="isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
                {{ message }}
            </div>

            <div class="form-group">
                <label for="mobilePay">MobilePay-nummer</label>
                <input id="mobilePay" v-model="formData.mobilePay" type="text" placeholder="F.eks. 25442" />
            </div>

            <div class="form-group">
                <label for="text">Beskrivelse</label>
                <input id="text" v-model="formData.text" type="text" placeholder="F.eks. Send til Dansk-Somalisk Forening" />
            </div>

        </div>

        <div class="card-footer">
            <button class="btn btn-secondary" @click="goBack">
                <i class="fas fa-arrow-left"></i> Tilbage
            </button>
            <button class="btn btn-primary" @click="addItem" :disabled="isSuccess">
                <i class="fas fa-save"></i> Gem MobilePay
            </button>
        </div>

    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="addDonation.js"></script>
</body>
</html>
