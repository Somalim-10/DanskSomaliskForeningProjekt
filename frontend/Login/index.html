<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Somalisk Dansk Forening</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-form.css">
</head>
<body>
    <div id="app">
        <div class="admin-card">
            <div class="card-header">
                <div class="card-header-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div>
                    <h1>Formand Login</h1>
                    <p>Log ind for at redigere foreningens indhold</p>
                </div>
            </div>

            <form @submit.prevent="login">
                <div class="card-body">
                    <div v-if="message" class="message-box" :class="isSuccess ? 'success' : 'error'">
                        <i :class="isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
                        {{ message }}
                    </div>

                    <div class="form-group">
                        <label for="username">Brugernavn</label>
                        <input
                            id="username"
                            v-model="formData.username"
                            type="text"
                            placeholder="Brugernavn"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Adgangskode</label>
                        <input
                            id="password"
                            v-model="formData.password"
                            type="password"
                            placeholder="Adgangskode"
                            required
                        >
                    </div>
                </div>

                <div class="card-footer">
                    <button type="submit" class="btn btn-primary" :disabled="isSuccess">
                        <i class="fas fa-sign-in-alt"></i> Log ind
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
