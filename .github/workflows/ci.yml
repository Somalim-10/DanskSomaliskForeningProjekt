name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: dotnet restore
      working-directory: ./backend/SomaliskDanskForening

    - name: Build
      run: dotnet build --no-restore --configuration Release
      working-directory: ./backend/SomaliskDanskForening

    - name: Test
      # Selenium er E2E-tests der kræver en browser og et kørende website
      # (http://127.0.0.1:5500). De ekskluderes i CI og køres lokalt.
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~Selenium"
      working-directory: ./backend/SomaliskDanskForening
