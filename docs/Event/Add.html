<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilføj event – Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-form.css" />
</head>
<body>

    
<!-- Admin Login Check -->
<script>
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role !== 'Admin') {
        alert('❌ Du skal være logget ind som admin for at få adgang her!');
        window.location.href = '../Login/index.html';
    }
</script>

<div id="app">
    <div class="admin-card">

        <div class="card-header">
            <div class="card-header-icon">
                <i class="fas fa-calendar-plus"></i>
            </div>
            <div>
                <h1>Tilføj event</h1>
                <p>Udfyld felterne og gem det nye arrangement</p>
            </div>
        </div>

        <div class="card-body">

            <div v-if="message" class="message-box" :class="isSuccess ? 'success' : 'error'">
                <i :class="isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
                {{ message }}
            </div>

            <div class="form-group">
                <label for="title">Titel</label>
                <input id="title" v-model="formData.title" type="text" placeholder="F.eks. Eid-fejring 2026" />
            </div>

            <div class="form-group">
                <label for="date">Dato</label>
                <input id="date" v-model="formData.date" type="date" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startTime">Starttidspunkt (time)</label>
                    <input id="startTime" v-model.number="formData.startTime" type="number" min="0" max="23" />
                </div>
                <div class="form-group">
                    <label for="duration">Varighed (timer)</label>
                    <input id="duration" v-model.number="formData.duration" type="number" min="1" max="12" />
                </div>
            </div>

            <div class="form-group">
                <label for="description">Beskrivelse</label>
                <textarea id="description" v-model="formData.description" placeholder="Kort beskrivelse af arrangementet..."></textarea>
            </div>
            <div class="form-group">
  <label for="imageUrl">Billede URL (valgfrit)</label>
  <div class="image-input-wrap">
    <input 
      id="imageUrl" 
      v-model="formData.imageUrl" 
      type="text" 
      placeholder="Indsæt link til billede, fx https://..." 
      @input="previewImage"
    />
    <div v-if="formData.imageUrl" class="image-preview">
      <img :src="formData.imageUrl" alt="Forhåndsvisning" @error="imageError = true" @load="imageError = false" />
      <p v-if="imageError" class="preview-error"><i class="fas fa-exclamation-circle"></i> Ugyldigt billed-link</p>
    </div>
  </div>
</div>

        </div>

        <div class="card-footer">
            <button class="btn btn-secondary" @click="goBack">
                <i class="fas fa-arrow-left"></i> Tilbage
            </button>
            <button class="btn btn-primary" @click="addItem" :disabled="isSuccess">
                <i class="fas fa-save"></i> Gem event
            </button>
        </div>

    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="addEvent.js"></script>
</body>
</html>
