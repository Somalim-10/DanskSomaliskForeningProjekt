<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rediger donation – Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-form.css" />
</head>
<body>

<!-- Admin Login Check -->
<script>
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role !== 'Admin') {
        alert('❌ Du skal være logget ind som admin for at få adgang her!');
        window.location.href = '../Login/index.html';
    }
</script>

<div id="app">
    <div class="admin-card">

        <div class="card-header">
            <div class="card-header-icon">
                <i class="fas fa-pen-to-square"></i>
            </div>
            <div>
                <h1>Rediger MobilePay</h1>
                <p>Opdater MobilePay-nummer og beskrivelse</p>
            </div>
        </div>

        <!-- Loading -->
        <div class="card-body" v-if="isLoading">
            <div class="loading-overlay">
                <i class="fas fa-spinner fa-spin"></i>
                Henter MobilePay-info...
            </div>
        </div>

        <!-- Form -->
        <div class="card-body" v-else>

            <div v-if="message" class="message-box" :class="isSuccess ? 'success' : 'error'">
                <i :class="isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle'"></i>
                {{ message }}
            </div>

            <div class="form-group">
                <label for="mobilePay">MobilePay-nummer</label>
                <input id="mobilePay" v-model="formData.mobilePay" type="text" placeholder="F.eks. 25442" />
            </div>

            <div class="form-group">
                <label for="text">Beskrivelse</label>
                <textarea id="text" v-model="formData.text" placeholder="F.eks. Send til Dansk-Somalisk Forening"></textarea>
            </div>

        </div>

        <div class="card-footer">
            <button class="btn btn-secondary" @click="goBack">
                <i class="fas fa-arrow-left"></i> Tilbage
            </button>
            <button class="btn btn-primary" @click="updateItem" :disabled="isLoading || isSuccess">
                <i class="fas fa-save"></i> Gem ændringer
            </button>
        </div>

    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="editDonation.js"></script>
</body>
</html>
